            let m = t.match(/^(\d{4})\D+(\d{1,2})/);
            if (m) {
                const mon = parseInt(m[2], 10);
                return (mon >= 1 && mon <= 12) ? `${m[1]}-${String(mon).padStart(2, '0')}` : '';
            }
            m = t.match(/^(\d{1,2})\/(\d{4})$/); // 10/2026
            if (m) {
                const mon = parseInt(m[1], 10);
                return (mon >= 1 && mon <= 12) ? `${m[2]}-${String(mon).padStart(2, '0')}` : '';
            }
            return '';
        }

        // 年月が現在年月か（比較は常に YYYY-MM 同士）
        const isPickNow = s => s.pickMonth !== '' && s.pickMonth === getCurrentYM();
        const isPremiumNow = s => s.premiumMonth !== '' && s.premiumMonth === getCurrentYM();

        function getCurrentYM() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        }

        let allStamps = [];
        let currentCategory = 'okinawa';
        let currentType = 'all';
        let currentSort = 'hearts';
        let searchQuery = '';
        let activeFeature = null;

        async function fetchTabCSV(gid) {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${gid}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Fetch failed for gid: ${gid}`);
            return await response.text();
        }

        function parseCSVText(csvText) {
            return new Promise((resolve) => {
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function (results) {
                        resolve(results.data);
                    },
                    error: function () {
                        resolve([]);
                    }
                });
            });
        }

        async function fetchSpreadsheetData() {
            const now = new Date();
            const ym = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
            return TW_WORKS.map(w => ({
                id: w.id, title: w.title, url: w.url, type: w.type, img: w.img, date: w.date,
                status: '', pickMonth: w.tw >= 2 ? ym : '', premiumMonth: '', premiumHasValue: false,
                rowText: w.title, hearts: 0, tw: w.tw, isRecommended: w.tw >= 2, isPremium: false,
                category: w.category
            }));
        }

        function render() {
            const grid = document.getElementById('stamp-grid');
            const emptyState = document.getElementById('empty-state');
            const featureComingSoon = document.getElementById('feature-coming-soon');
            grid.innerHTML = '';

            const isFeatureActive = activeFeature !== null || currentCategory === 'recommended';
            if (isFeatureActive && FEATURE_COMING_SOON) {
                grid.classList.add('hidden');
                emptyState.classList.add('hidden');
                featureComingSoon.classList.remove('hidden');
                updateBadgeCounts();
                return;
            }

            featureComingSoon.classList.add('hidden');

            let filtered;
            if (activeFeature !== null) {
                // 🌟 特集表示中：特集条件だけを適用（カテゴリ・種類・検索は一切見ない）
                filtered = allStamps.filter(stamp =>
                    activeFeature === 'recommended' ? isPickNow(stamp) : stamp.isPremium);
            } else {
                // 通常時：カテゴリ + 種類 + 検索
                filtered = allStamps.filter(stamp => {
                    if (currentCategory === 'recommended') {
                        if (!isPickNow(stamp)) return false;
                    } else if (currentCategory === 'themes') {
                        if (stamp.type !== 'theme') return false;
                    } else if (stamp.category !== currentCategory) {
                        return false;
                    }
                    const matchType = currentType === 'all' || stamp.type === currentType;
                    const matchSearch = searchQuery === '' || stamp.title.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchType && matchSearch;
                });
            }

            if (activeFeature === 'premium') {
                // 👑 プレミアム作品：① 今月解禁 → ② それ以外。各グループ内は作品の販売開始日の新しい順
                filtered.sort((a, b) => {
                    const ga = isPremiumNow(a) ? 0 : 1, gb = isPremiumNow(b) ? 0 : 1;
                    if (ga !== gb) return ga - gb;
                    return new Date(b.date || 0) - new Date(a.date || 0);
                });
            } else if (currentSort === 'newest') {
                filtered.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
            } else if (currentSort === 'hearts') {
                filtered.sort((a, b) => {
                    if ((b.tw || 0) !== (a.tw || 0)) {
                        return (b.tw || 0) - (a.tw || 0);
                    }
                    return new Date(b.date || 0) - new Date(a.date || 0);
                });
            }

            updateBadgeCounts();
            dlog('activeFeature:', activeFeature, '/ 絞り込み後件数:', filtered.length);

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.classList.remove('hidden');

            filtered.forEach(stamp => {
                const today = new Date();
                const releaseDate = stamp.date ? new Date(stamp.date) : null;
                const diffTime = releaseDate ? (today - releaseDate) : 0;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

                const isNew = diffDays >= 0 && diffDays <= 30;

                const isHot = (stamp.tw || 0) >= 6;
                const isClassic = !isHot && (stamp.tw || 0) >= 3;

                let badgeLabel = '貼圖';
                let badgeStyle = 'bg-pink-50 text-pink-600 border border-pink-100';

                if (stamp.type === 'theme') {
                    badgeLabel = '主題';
                    badgeStyle = 'bg-teal-50 text-teal-600 border border-teal-100';
                } else if (stamp.type === 'emoji') {
                    badgeLabel = '表情貼';
                    badgeStyle = 'bg-purple-50 text-purple-600 border border-purple-100';
                } else if (stamp.type === 'animated-sticker') {
                    badgeLabel = '動態貼圖';
                    badgeStyle = 'bg-rose-50 text-rose-600 border border-rose-100';
                } else if (stamp.type === 'animated-emoji') {
                    badgeLabel = '動態表情貼';
                    badgeStyle = 'bg-indigo-50 text-indigo-600 border border-indigo-100';
                } else if (stamp.type === 'popup-sticker') {
                    badgeLabel = '彈出貼圖';
                    badgeStyle = 'bg-amber-50 text-amber-600 border border-amber-100';
                } else if (stamp.type === 'effect-sticker') {
                    badgeLabel = '特效貼圖';
                    badgeStyle = 'bg-cyan-50 text-cyan-600 border border-cyan-100';
                }

                // ✨ 推しバッジ
                const recommendBadge = stamp.isRecommended
                    ? `<span class="text-[10px] text-amber-700 font-bold bg-amber-50 border border-amber-200 px-1.5 py-0.5 rounded-full flex items-center gap-0.5"><i class="fa-solid fa-star text-amber-500 text-[9px]"></i>${stamp.pickMonth.replace('-', '.')} 熱賣</span>`
                    : '';

                // 👑 プレミアムバッジ
                const premiumBadge = stamp.isPremium
                    ? `<span class="text-[10px] text-purple-700 font-bold bg-purple-50 border border-purple-200 px-1.5 py-0.5 rounded-full flex items-center gap-0.5"><i class="fa-solid fa-crown text-purple-500 text-[9px]"></i>${stamp.premiumMonth ? stamp.premiumMonth.replace('-', '.') + ' ' : ''}プレミアム</span>`
                    : '';

                // 🆕 今月解禁バッジ（プレミアム作品一覧で、プレミアム月＝現在年月の作品のみ）
                const unlockBadge = (activeFeature === 'premium' && isPremiumNow(stamp))
                    ? `<span class="text-[10px] text-white font-bold bg-purple-600 px-1.5 py-0.5 rounded-full">今月解禁</span>`
                    : '';

                // 🏷️ 急上昇・定番バッジ
                let trendBadge = '';
                if (isHot) {
                    trendBadge = `<span class="text-[10px] text-orange-600 font-bold bg-orange-50 border border-orange-200 px-1.5 py-0.5 rounded-full flex items-center gap-0.5"><i class="fa-solid fa-fire text-orange-500 text-[9px]"></i>超熱賣</span>`;
                } else if (isClassic) {
                    trendBadge = `<span class="text-[10px] text-amber-700 font-bold bg-amber-50 border border-amber-200 px-1.5 py-0.5 rounded-full flex items-center gap-0.5"><i class="fa-solid fa-crown text-amber-500 text-[9px]"></i>經典</span>`;
                }

                const heartBadge = stamp.hearts > 0
                    ? `<span class="text-[10px] text-rose-500 font-bold bg-rose-50 px-1.5 py-0.5 rounded-full flex items-center gap-0.5"><i class="fa-solid fa-heart text-[8px]"></i>${stamp.hearts}</span>`
                    : '';

                const dateHtml = stamp.date
                    ? `<p class="text-[10px] text-gray-400 font-bold flex items-center gap-1 pt-1"><i class="fa-regular fa-calendar-days text-[9px] text-gray-400"></i>${stamp.date} 上市</p>`
                    : '';

                const card = `
                    <a href="${stamp.url}" target="_blank" rel="noopener" 
                       class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col hover:shadow-md transition duration-200 active:scale-[0.98]">
                        <div class="img-aspect-square bg-white flex items-center justify-center p-3 border-b border-gray-100">
                            <img src="${stamp.img}" alt="${stamp.title}" loading="lazy" class="max-w-full max-h-full object-contain"
                                 onerror="this.onerror=null; this.src='https://placehold.co/150x150/ffffff/cccccc?text=LINE';">
                        </div>
                        <div class="p-3 flex flex-col justify-between flex-grow space-y-2">
                            <div class="space-y-1">
                                <div class="flex items-center justify-between gap-1 flex-wrap">
                                    <div class="flex items-center gap-1 flex-wrap">
                                        <span class="inline-block text-[9px] font-black px-1.5 py-0.5 rounded ${badgeStyle}">${badgeLabel}</span>
                                        ${recommendBadge}
                                        ${unlockBadge}
                                        ${premiumBadge}
                                        ${trendBadge}
                                    </div>
                                    ${heartBadge}
                                </div>
                                <h3 class="text-xs font-bold text-gray-800 line-clamp-2 leading-snug h-[34px]">${stamp.title}</h3>
                                ${dateHtml}
                            </div>
                            <div class="flex items-center justify-between text-[10px] text-gray-400 font-bold border-t border-gray-50 pt-2">
                                <span class="text-[#00C300]">LINE STORE</span>
                                <i class="fa-solid fa-chevron-right text-[8px] text-[#00C300]"></i>
                            </div>
                        </div>
                    </a>
                `;
                grid.insertAdjacentHTML('beforeend', card);
            });
        }

        function toggleFeature(featureKey) {
            if (activeFeature === featureKey) {
                clearFeature();
                return;
            }

            activeFeature = featureKey;
            updateFeatureUI();
            render();
        }

        function clearFeature() {
            activeFeature = null;
            updateFeatureUI();
            render();
        }

        function updateFeatureUI() {
            const statusText = document.getElementById('feature-status-text');
            const resetBar = document.getElementById('feature-reset-bar');
            const resetLabel = document.getElementById('feature-reset-label');
            const searchContainer = document.getElementById('search-input-container');
            // 特集中は検索・カテゴリ・並び替え・種類フィルターをまとめて非表示にする（選択値は変更しないので、解除後に復帰）
            const filterPanel = document.getElementById('filter-panel');
            if (filterPanel) filterPanel.classList.toggle('hidden', activeFeature !== null);

            ['recommended', 'premium'].forEach(key => {
                const btn = document.getElementById(`feature-btn-${key}`);
                if (btn) {
                    if (activeFeature === key) {
                        btn.classList.add('ring-4', 'ring-[#00C300]', 'scale-[1.02]');
                    } else {
                        btn.classList.remove('ring-4', 'ring-[#00C300]', 'scale-[1.02]');
                    }
                }
            });

            if (activeFeature) {
                statusText.classList.remove('hidden');
                resetBar.classList.remove('hidden');
                // 🔍 特集絞り込み中は検索バーを非表示にする
                if (searchContainer) searchContainer.classList.add('hidden');

                let title = '特集';
                if (activeFeature === 'recommended') title = '✨ 台灣熱賣特集';
                if (activeFeature === 'premium') title = '👑 プレミアム作品';

                resetLabel.innerHTML = `<i class="fa-solid fa-sparkles text-[#00C300]"></i> <strong>${title}</strong> を表示中`;
            } else {
                statusText.classList.add('hidden');
                resetBar.classList.add('hidden');
                // 🔍 通常画面では検索バーを表示する
                if (searchContainer) searchContainer.classList.remove('hidden');
            }
        }

        function changeSort(type) {
            currentSort = type;
            localStorage.setItem('portfoliotw_sort', type);

            const btnNewest = document.getElementById('sort-newest');
            const btnHearts = document.getElementById('sort-hearts');

            if (type === 'newest') {
                btnNewest.className = 'text-[#00C300] font-bold transition';
                btnHearts.className = 'text-gray-400 hover:text-[#00C300] transition';
            } else {
                btnHearts.className = 'text-[#00C300] font-bold transition';
                btnNewest.className = 'text-gray-400 hover:text-[#00C300] transition';
            }
            if (allStamps.length > 0) render();
        }

        function updateBadgeCounts() {
            const recommendedCount = allStamps.filter(isPickNow).length;
            const okinawaCount = allStamps.filter(s => s.category === 'okinawa').length;
            const keigoCount = allStamps.filter(s => s.category === 'keigo').length;
            const plantsCount = allStamps.filter(s => s.category === 'plants').length;
            const shrimpCount = allStamps.filter(s => s.category === 'shrimp').length;
            const themesCount = allStamps.filter(s => s.type === 'theme').length;
            const othersCount = allStamps.filter(s => s.category === 'others').length;

            document.getElementById('count-recommended').textContent = recommendedCount;
            document.getElementById('count-okinawa').textContent = okinawaCount;
            document.getElementById('count-keigo').textContent = keigoCount;
            document.getElementById('count-plants').textContent = plantsCount;
            document.getElementById('count-shrimp').textContent = shrimpCount;
            document.getElementById('count-themes').textContent = themesCount;
            document.getElementById('count-others').textContent = othersCount;
            document.getElementById('total-count').textContent = `共 ${allStamps.length} 件作品・台灣也能購買！`;
        }

        function switchCategory(category) {
            if (activeFeature) {
                activeFeature = null;
                updateFeatureUI();
            }

            currentCategory = category;
            localStorage.setItem('portfoliotw_category', category);

            ['recommended', 'okinawa', 'keigo', 'plants', 'shrimp', 'themes', 'others'].forEach(cat => {
                const tab = document.getElementById(`tab-${cat}`);
                if (tab) {
                    if (cat === category) {
                        tab.classList.add('btn-active');
                    } else {
                        tab.classList.remove('btn-active');
                    }
                }
            });

            if (allStamps.length > 0) render();
        }

        function filterType(type) {
            currentType = type;
            localStorage.setItem('portfoliotw_type', type);

            ['all', 'sticker', 'animated-sticker', 'popup-sticker', 'effect-sticker', 'emoji', 'animated-emoji', 'theme'].forEach(t => {
                const btn = document.getElementById(`sub-${t}`);
                if (btn) {
                    if (t === type) {
                        btn.classList.add('btn-active');
                    } else {
                        btn.classList.remove('btn-active');
                    }
                }
            });

            if (allStamps.length > 0) render();
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            render();
        });

        function showError() {
            document.getElementById('loading-placeholder').classList.add('hidden');
            document.getElementById('error-message').classList.remove('hidden');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const savedSort = localStorage.getItem('portfoliotw_sort') || 'hearts';
            const savedCategory = localStorage.getItem('portfoliotw_category') || 'recommended';
            const savedType = localStorage.getItem('portfoliotw_type') || 'all';

            changeSort(savedSort);
            switchCategory(savedCategory);
            filterType('all');

            const stamps = await fetchSpreadsheetData();
            allStamps = stamps;

            document.getElementById('loading-placeholder').classList.add('hidden');
            if (stamps && stamps.length > 0) {
                render();
            } else {
                showError();
            }
        });
    </script>
<script data-goatcounter="https://arakakiai.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
